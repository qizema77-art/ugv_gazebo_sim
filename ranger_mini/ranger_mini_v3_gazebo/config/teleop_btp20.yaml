# 北通鲲鹏20手柄 teleop_twist_joy 配置示例
# 左摇杆控制前进/后退（Y轴）和转向（X轴）
# 右扳机（RT）加速，左扳机（LT）减速（可选）
# 你可以根据实际按键编号调整

axis_linear: 1      # 左摇杆上下
axis_angular: 0     # 左摇杆左右
scale_linear: 0.8   # 最大线速度
scale_angular: -0.2  # 最大角速度（修正为正右负左）

# 按钮映射（可选，按住A键才允许动）
enable_button: 0    # A键（一般为0）

# 反向（如发现前进/转向方向反了可改为-1）
scale_linear_turbo: 1.2
scale_angular_turbo: -2.0

# 其他高级参数可参考官方文档
